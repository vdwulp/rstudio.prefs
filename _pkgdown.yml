    after_navbar: |
      <span style="display: flex; align-items: center;
        align-self: center; line-height: 0">
        <iframe src="https://github.com/sponsors/vdwulp/button"
          title="Sponsor vdwulp" width="114" height="32"
          style="display: block; border: 0; border-radius: 6px">
        </iframe>
      </span>

authors:
  "Daniel D. Sjoberg":
    href: https://www.danieldsjoberg.com/
    html: ddsjoberg
  "S.A. van der Wulp":
    href: https://vdwulp.github.io/
    html: vdwulp

reference:
